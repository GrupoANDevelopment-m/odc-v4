name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check odc tests
      - name: Black check
        run: black --check odc tests

  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          pip install -e ".[dev]"
      - name: MyPy
        run: mypy odc
        continue-on-error: true  # mypy errors are warnings for now

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          pip install -e ".[test]"
      - name: Run unit tests
        run: |
          pytest tests/ -q -m "not slow and not integration and not llm and not browser and not network" -p no:cacheprovider --tb=short
      - name: Coverage
        run: |
          pytest tests/ --cov=odc --cov-report=xml -m "not slow and not integration and not llm and not browser and not network" -p no:cacheprovider
      - uses: codecov/codecov-action@v3
        with:
          file: coverage.xml
          fail_ci_if_error: false

  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          pip install -e ".[test]"
          python -m playwright install chromium
      - name: Run integration
        run: |
          pytest tests/ -q -m "integration or browser" -p no:cacheprovider --tb=short
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ODC_LLM_PROVIDER: nvidia

  test-llm:
    name: Real-LLM tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          pip install -e ".[test]"
      - name: Run LLM tests
        run: |
          pytest tests/test_cognitive_suite.py tests/test_audit_adversarial.py -q -m "llm" -p no:cacheprovider --tb=short
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ODC_LLM_PROVIDER: nvidia
      - name: Run self-heal real LLM
        run: |
          python test_self_heal_real_llm.py
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

  audit:
    name: Full audit
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          pip install -e ".[test]"
      - name: Cognitive suite
        run: |
          pytest tests/test_cognitive_suite.py -q -p no:cacheprovider --tb=short
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      - name: Adversarial audit
        run: |
          pytest tests/test_audit_adversarial.py -q -p no:cacheprovider --tb=short
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      - name: Deep audit
        run: |
          pytest tests/test_deep_audit.py -q -p no:cacheprovider --tb=short

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    needs: [lint, type-check, test-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          pip install build
      - name: Build
        run: |
          python -m build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test-unit]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t odc-v4:ci-${{ github.sha }} .
      - name: Save image
        run: |
          docker save odc-v4:ci-${{ github.sha }} > /tmp/odc-v4.tar
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/odc-v4.tar

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          pip install bandit safety
      - name: Bandit
        run: bandit -r odc -ll
        continue-on-error: true
      - name: Safety
        run: safety check --json
        continue-on-error: true
