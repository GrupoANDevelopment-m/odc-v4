[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odc-v4"
version = "4.0.0"
description = "Open Digital Companion — self-improving LLM agent with cognitive architecture, AST+LLM self-heal, MCP memory, OSINT, browser automation, and a 3D web interface."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Grupo AN Development"},
]
keywords = ["agent", "llm", "ai", "self-healing", "mcp", "osint", "browser-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "jsonschema>=4.20.0",
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "playwright>=1.40.0",
    "openai>=1.30.0",
    "anthropic>=0.20.0",
    "google-generativeai>=0.3.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = ["ruff==0.1.9", "mypy==1.7.1", "black==23.12.0"]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.90.0",
]
docs = ["sphinx>=7.0.0", "sphinx-rtd-theme>=1.3.0"]

[project.scripts]
odc = "odc.cli:main"
odc-server = "odc.server:main"

[project.urls]
Homepage = "https://github.com/GrupoANDevelopment-m/odc-v4"
Repository = "https://github.com/GrupoANDevelopment-m/odc-v4"
Issues = "https://github.com/GrupoANDevelopment-m/odc-v4/issues"
Changelog = "https://github.com/GrupoANDevelopment-m/odc-v4/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = true
packages = ["odc"]

[tool.setuptools.package-data]
odc = ["py.typed", "*.json", "*.yaml", "*.md"]

# === Ruff (linter + formatter) ===
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["odc", "tests"]
exclude = ["third_party", "docs", ".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "PIE", "PT", "RET", "SIM", "TID"]
ignore = [
    "E501",  # line too long (we have specific cases)
    "B008",  # function call in default argument (FastAPI-like pattern)
    "B905",  # zip() without strict= (intentional for backward compat)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F401", "F811"]
"third_party/*" = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "PIE", "PT", "RET", "SIM", "TID"]

# === MyPy ===
[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["third_party", "docs", ".venv", "__pycache__"]

# === Pytest ===
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks integration tests (require external services)",
    "llm: marks tests that call real LLM (require NVIDIA_API_KEY)",
    "network: marks tests that require network access",
    "browser: marks tests that require browser (playwright install)",
    "timeout: marks tests with custom timeout",
]

# === Coverage ===
[tool.coverage.run]
source = ["odc"]
omit = [
    "odc/__pycache__/*",
    "odc/*/__pycache__/*",
    "tests/*",
    "third_party/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
precision = 1
