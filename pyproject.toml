[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odc"
version = "4.0.0"
description = "Honest LLM agent with tools, skills, persistent memory, and a closed loop."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ODC Contributors" }]
keywords = ["agent", "llm", "tools", "memory", "skills"]

# Core dependencies — kept small on purpose. Optional extras for richer features.
dependencies = [
    "httpx>=0.27",                # HTTP client (sync + async) — LLM calls, web
    "pydantic>=2.6",              # schemas, validation
    "typer>=0.12",                # CLI
    "rich>=13.7",                 # pretty console output
    "python-dotenv>=1.0",         # .env loading
    "sqlite-fts5-stemmer>=0.2",   # stemmer for FTS5
    "pyyaml>=6.0",                # config files
]

[project.optional-dependencies]
# Pick at least one LLM provider
anthropic = ["anthropic>=0.39"]
openai = ["openai>=1.40"]
ollama = ["httpx>=0.27"]   # ollama is plain HTTP, no extra dep
nvidia = ["openai>=1.40"]  # NVIDIA exposes OpenAI-compatible API

# Pick the tools you want
web = [
    "beautifulsoup4>=4.12",
    "trafilatura>=1.12",          # cleaner article extraction
    "duckduckgo-search>=6.1",     # search
]
browser = [
    "browser-use>=0.1.0",          # real browser automation (optional)
]
reach = [
    "yt-dlp>=2024.5",             # youtube transcripts / downloads
    "feedparser>=6.0",            # RSS
]
shell = []
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",        # for sandbox scenarios tests
    "ruff>=0.4",
]

[project.scripts]
odc = "odc.cli:app"

[tool.setuptools.packages.find]
include = ["odc*"]
exclude = ["tests*", "third_party*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "network: tests that hit live public APIs (may be flaky in CI)",
    "llm: tests that require a real LLM API key",
]
# Mark tests that hit live networks so they can be filtered
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["odc"]
omit = [
    "odc/tests/*",
    "odc/daemon/*",
    "odc/web/static/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
precision = 1

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line too long (we handle wrapping visually)
    "B008",  # function call in default argument (used in many places)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "B011"]
"odc/daemon/*" = ["E402"]
